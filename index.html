.dc-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bt{min-width:1120px}
.bt td{vertical-align:top}
.bt tr[data-bal]{cursor:pointer}
.bt tr[data-bal]:hover td{background:var(--chip)}
.bt tr.ex td{background:var(--bg)}
.crs{display:flex;flex-wrap:wrap;gap:4px;max-width:230px}
.crs span{font-family:var(--mono);font-size:.74rem;background:var(--chip);padding:1px 6px}
.crs span.mx{background:var(--accent);color:var(--bg);font-weight:600}
.cbar{display:grid;grid-template-columns:64px minmax(0,1fr) 150px;gap:8px;align-items:center;font-size:.82rem;margin-bottom:5px}
.cbar .tr{height:14px;background:var(--chip)}
.cbar .fl{height:100%;background:var(--ais)}
.cbar.mx .fl{background:var(--accent)}
.cbar .v{font-family:var(--mono);text-align:right}
.bal-tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.formula{color:var(--muted);font-size:.84rem;margin:0}
.ex-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:760px){.ex-grid{grid-template-columns:minmax(0,1fr)}}
.pane[hidden],.ov[hidden],[data-sub][hidden]{display:none!important}
</style>

<style>
/* tema cerah */
body{background:linear-gradient(180deg,#eaf4fb 0,#f6fafd 320px,#f6fafd 100%) fixed}
.gl-stage{background:linear-gradient(180deg,#e3f1fa 0%,#f5fafd 100%);border-color:#bfd8e8;color:var(--ink);box-shadow:0 8px 24px rgba(40,100,150,.12)}
.gl-stage .vsub,.gl-stage .legend{color:var(--muted)}
.gl-stage .legend svg rect{stroke:#456}
.gl-ctrl button{background:#fff;color:var(--ink);border-color:var(--line)}
.gl-ctrl button:hover{background:#eef6fb}
.gl-ctrl button[aria-pressed="true"]{background:var(--ais);color:#fff;border-color:var(--ais)}
.gl-time .mono{color:var(--ink)}
.hero-stats{background:#e9f3f9}
.hero-stats>div{background:rgba(255,255,255,.92);border-color:var(--line);color:var(--ink);backdrop-filter:none}
.hero-stats span,.hero-stats i{color:var(--muted)}
.hero{box-shadow:0 8px 24px rgba(40,100,150,.18)}
.hero::before{background:linear-gradient(180deg,rgba(8,40,70,.62) 0%,rgba(8,40,70,.28) 40%,rgba(8,40,70,0) 70%)}
.ov{background:rgba(30,60,90,.35)}
</style>

function pickLang(){

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ms(s){var d=Date.parse(s);return isNaN(d)?null:d}
var fmtP=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
function parts(d){var o={};fmtP.formatToParts(new Date(d)).forEach(function(p){o[p.type]=p.value});return o}
function dt(s){var d=ms(s);if(d==null)return '-';var p=parts(d);return p.day+'/'+p.month+' '+p.hour+':'+p.minute}
function dur(h){h=Math.abs(h);var d=Math.floor(h/24),hh=Math.round(h-d*24);if(hh===24){d++;hh=0}return S.dur(d,hh)}
function durMin(m){m=Math.abs(m);var h=Math.floor(m/60),mm=Math.round(m%60);return S.durMin(h,String(mm).padStart(2,'0'))}
function ago(s,now){var d=ms(s);if(d==null)return '-';var m=(now-d)/60000;return m<60?S.ago(Math.round(m),'m'):(m<2880?S.ago(Math.round(m/60),'h'):S.ago(Math.round(m/1440),'d'))}

  if(v.phase==='waiting_other')return [S.st_wait,'bad'];
  if(v.phase==='moored_other')return [S.st_moor(pn(v.next)),'ok'];
  return [S.st_sail(pn(v.next)),'ok'];

function alertsFor(now){
  var A=[],h=36e5;
  VESSELS.forEach(function(v){
    var n=esc(v.name+' '+v.voy), tm=esc(v.term.name);var pu=function(o){o.id=v.id;A.push(o)};
    var nx=ms(v.next.eta);
    if(v.phase==='waiting_other'&&nx&&nx<now)
      pu({sev:'bad',tag:S.tg.last,txt:S.a_last(n,esc(aisSt(v.ais.status).toLowerCase()),esc(areaT(v.ais.area)),dur((now-nx)/h),esc(pn(v.next)),dt(v.next.eta),esc(pn(v.last)),dt(v.last.atd))});
    if(v.phase==='enroute_jkt'){
      var te=ms(v.term.eta);
      if(te&&te<now)pu({sev:'warn',tag:S.tg.web,txt:S.a_web(n,tm,dt(v.term.eta),dt(v.next.eta))});
      var ee=ms(v.jkt.eta),ae=ms(v.next.eta);
      if(ee&&ae&&Math.abs(ae-ee)>=6*h)pu({sev:'warn',tag:S.tg.src,txt:S.a_src(n,dt(v.jkt.eta),dt(v.next.eta),dur((ae-ee)/h))});
      var tb=ms(v.term.berth),eb=ms(v.jkt.etb);
      if(tb&&eb&&Math.abs(tb-eb)>=6*h)pu({sev:'info',tag:S.tg.etb,txt:S.a_etb(n,tm,dt(v.term.berth),dt(v.jkt.etb),dur((tb-eb)/h))});
      var cl=ms(v.term.closing);
      if(cl&&ae&&cl<ae)pu({sev:'info',tag:S.tg.clo,txt:S.a_clo(n,tm,dt(v.term.closing),dt(v.next.eta))});
    }else{
      var tb2=ms(v.term.berth),eb2=ms(v.jkt.etb);

function nn(k){var o=N[LANG];return(o&&o[k]!=null)?o[k]:N.en[k]}
function fdt(t){
  if(t==null||isNaN(t))return '–';
  var o={};new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(t)).forEach(function(p){o[p.type]=p.value});
  return o.year+'-'+o.month+'-'+o.day+' '+(o.hour==='24'?'00':o.hour)+':'+o.minute;
}

/* ----- tab ----- */
function renderTabbar(A,di){
  var tb=document.getElementById('tabbar');if(!tb)return;
  var fo=document.activeElement&&document.activeElement.getAttribute?document.activeElement.getAttribute('data-tab'):null;
  var T=nn('tabs'),bad=A.filter(function(a){return a.sev!=='info'}).length,badge={alert:bad,bal:BAL.length};
  tb.innerHTML=TABS.map(function(t){var n=badge[t];return '<button type="button" role="tab" data-tab="'+t+'" aria-selected="'+(t===TAB?'true':'false')+'">'+esc(T[t])+(n?'<span class="bd'+(t==='alert'?' hot':'')+'">'+n+'</span>':'')+'</button>'}).join('')+(di.length?'<button type="button" class="bell" data-bell="1">'+esc(nn('bell')(di.length))+'</button>':'');
  if(fo){var b=tb.querySelector('[data-tab="'+fo+'"]');if(b)b.focus()}
}
function showTab(t,keep){
  if(TABS.indexOf(t)<0)t='over';TAB=t;
  document.querySelectorAll('.pane').forEach(function(p){p.hidden=p.getAttribute('data-pane')!==t});
  document.querySelectorAll('#tabbar [data-tab]').forEach(function(b){b.setAttribute('aria-selected',b.getAttribute('data-tab')===t?'true':'false')});
  if(!keep){try{localStorage.setItem('obTab',t)}catch(e){}}
  if(t==='globe')requestAnimationFrame(function(){glRender()});
}
function goTo(id){
  var t='over';
  if(id==='sec-alerts'||id==='sec-delay')t='alert';else if(id==='sec-globe')t='globe';else if(id==='sec-cargo')t='cargo';else if(id==='sec-all')t='all';else if(id==='sec-bal')t='bal';else if(id==='sec-tl')t='tl';
  showTab(t);
  var el=document.getElementById(id);if(!el)return;
  requestAnimationFrame(function(){
    var rm=false;try{rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(x){}
    el.scrollIntoView({behavior:rm?'auto':'smooth',block:'start'});
    el.classList.remove('jump');void el.offsetWidth;el.classList.add('jump');setTimeout(function(){el.classList.remove('jump')},1500);
  });
}
function cgSub(){

function LT(o,f){var e=o[f+'En']||'',k=o[f+'Ko']||'';if(LANG==='en')return e||o[f]||'';if(LANG==='ko')return k||e||o[f]||'';return o[f]||''}
function delayItems(now){
  var out=[],h=36e5,have={};
  DELAYS.forEach(function(d){
    if(!d||d.status==='selesai')return;
    var id=d.vesselId||d.id;have[id]=1;
    out.push({id:id,name:d.name||id,voy:d.voy||'',term:d.terminal||'',reason:LT(d,'reason'),src:d.from||'yayan',srcAt:d.mailAt,oldEtb:d.oldEtb||'',newEtb:d.newEtb||'',delayH:d.delayH,kind:'sandar',note:LT(d,'note')});
  });
  VESSELS.forEach(function(v){
    if(have[v.id])return;
    var etb=ms(v.jkt.etb),near=v.phase==='enroute_jkt'||(etb!=null&&etb-now<72*h&&etb-now>-24*h);
    if(v.jkt.delayH>6&&near)out.push({id:v.id,name:v.name,voy:v.voy,term:v.term.name,reason:causeT(v.jkt.cause),src:v.jkt.src,srcAt:v.jkt.srcDate,oldEtb:'',newEtb:v.jkt.etb,delayH:v.jkt.delayH,kind:'jadwal',note:LT(v.jkt,'note')});
  });
  out.sort(function(a,b){return (ms(a.newEtb)||0)-(ms(b.newEtb)||0)});
  return out;
}

   '<div class="dlg-f"><button type="button" class="btn" data-globe="'+esc(id)+'">'+esc(nn('md_globe'))+'</button><button type="button" class="btn pri" data-close="1">'+esc(nn('close'))+'</button></div>';

/* ----- balance cargo ----- */
function balCalc(d){
  var cr=(d.cranes||[]).filter(function(c){return c&&typeof c.box==='number'&&isFinite(c.box)});
  var term=String(d.term||'').toUpperCase(),bch=BCHM==='auto'?(term==='KOJA'?17:15):Number(BCHM),at=Date.parse(d.at);
  var tot=0,mx=null;cr.forEach(function(c){tot+=c.box;if(!mx||c.box>mx.box)mx=c});
  if(!mx||isNaN(at)||!bch)return {ok:false,tot:tot,bch:bch};
  var hrs=mx.box/bch,done=at+hrs*36e5,dep=done+36e5;
  var ed=ms(d.estDoneAt),ep=ms(d.estDepAt);
  return {ok:true,bch:bch,tot:tot,mx:mx,hrs:hrs,at:at,done:done,dep:dep,dDone:ed!=null?(done-ed)/36e5:null,dDep:ep!=null?(dep-ep)/36e5:null};
}
function renderBalance(now){
  var set=function(id,t){var e=document.getElementById(id);if(e)e.textContent=t};
  set('bal-h',nn('bal_h'));set('bal-hs',nn('bal_hs'));set('bal-bchl',nn('bal_bchl'));set('bal-formula',nn('bal_formula'));
  var bs=document.getElementById('bchs');
  if(bs)bs.innerHTML=[['auto',nn('bal_auto')],['15','15'],['17','17']].map(function(k){return '<button type="button" data-bch="'+k[0]+'" aria-pressed="'+(k[0]===BCHM?'true':'false')+'">'+esc(k[1])+'</button>'}).join('');
  var nt=document.getElementById('bal-notes');if(nt)nt.innerHTML=BAL.length?nn('bal_notes').map(function(x){return '<li>'+esc(x)+'</li>'}).join(''):'';
  var body=document.getElementById('bal-body'),kp=document.getElementById('bal-kpis');
  if(!BAL.length){if(kp)kp.innerHTML='';if(body)body.innerHTML='<div class="panel">'+esc(nn('bal_none'))+'</div>';return}
  var rows=BAL.map(function(d){return {d:d,c:balCalc(d)}}).sort(function(a,b){return (a.c.ok?a.c.dep:9e15)-(b.c.ok?b.c.dep:9e15)});
  var tb=nn('th'),K=nn('bk'),tot=0,dif=0,nx=null;
  rows.forEach(function(r){tot+=r.c.tot||0;if(r.c.ok){if((r.c.dDone!=null&&Math.abs(r.c.dDone)>=2)||(r.c.dDep!=null&&Math.abs(r.c.dDep)>=2))dif++;if(r.c.dep>now&&(!nx||r.c.dep<nx.c.dep))nx=r}});
  if(kp)kp.innerHTML=[[rows.length,K.n,''],[cN(tot),K.t,''],[dif,K.d,''],[nx?fdt(nx.c.dep).slice(5):'–',K.nx,nx?nx.d.name+' '+nx.d.voy:'']].map(function(k){return '<div class="cg-k"><span>'+esc(k[1])+'</span><b>'+esc(k[0])+'</b><i>'+esc(k[2])+'</i></div>'}).join('');
  var dpill=function(h){if(h==null)return '<span class="sub">'+esc(nn('emailNone'))+'</span>';return Math.abs(h)>=2?'<span class="pill warn">'+esc(nn('diff')(h))+'</span>':'<span class="pill ok">'+esc(nn('ok'))+'</span>'};
  var html='<div class="scroll"><table class="bt"><thead><tr>'+['v','t','a','c','tot','p','h','fc','fe','dc','de'].map(function(k){return '<th>'+esc(tb[k])+'</th>'}).join('')+'</tr></thead><tbody>';
  rows.forEach(function(r){
    var d=r.d,c=r.c,open=BOPEN===d.id;
    var cr=(d.cranes||[]).map(function(x){var mxx=c.ok&&c.mx&&x.no===c.mx.no;return '<span'+(mxx?' class="mx"':'')+'>#'+esc(x.no)+' '+cN(x.box)+(x.long?' L':'')+'</span>'}).join('');
    html+='<tr data-bal="'+esc(d.id)+'" tabindex="0" role="button" aria-expanded="'+(open?'true':'false')+'"><td><span class="nm">'+esc(d.name)+'</span><span class="sub">'+esc(d.voy)+' · '+esc(d.op||'')+'</span></td><td>'+esc(d.term||'–')+'</td><td class="mono">'+fdt(Date.parse(d.at))+'</td><td><div class="crs">'+cr+'</div></td>'+
     '<td class="mono"><b>'+cN(c.tot)+'</b></td><td class="mono">'+(c.ok?'#'+esc(c.mx.no)+' · '+cN(c.mx.box):'–')+'</td><td class="mono">'+(c.ok?c.hrs.toFixed(2)+' <span class="sub">BCH '+c.bch+'</span>':'–')+'</td>'+
     '<td class="mono"><b>'+(c.ok?fdt(c.done):'–')+'</b>'+(c.ok&&c.dDone!=null?'<span class="sub" style="font-family:var(--body)">'+dpill(c.dDone)+'</span>':'')+'</td>'+
     '<td class="mono">'+(d.estDoneText?esc(d.estDoneText):'<span class="sub">'+esc(nn('emailNone'))+'</span>')+(d.estDoneAt?'<span class="sub">'+fdt(Date.parse(d.estDoneAt))+'</span>':'')+'</td>'+
     '<td class="mono"><b>'+(c.ok?fdt(c.dep):'–')+'</b>'+(c.ok&&c.dDep!=null?'<span class="sub" style="font-family:var(--body)">'+dpill(c.dDep)+'</span>':'')+'</td>'+
     '<td class="mono">'+(d.estDepText?esc(d.estDepText):'<span class="sub">'+esc(nn('emailNone'))+'</span>')+(d.estDepAt?'<span class="sub">'+fdt(Date.parse(d.estDepAt))+'</span>':'')+'</td></tr>';
    if(open){
      var mxb=c.ok?c.mx.box:1,bars=(d.cranes||[]).map(function(x){var w=mxb?Math.max(1,x.box/mxb*100):0,isM=c.ok&&x.no===c.mx.no;return '<div class="cbar'+(isM?' mx':'')+'"><span>'+esc(nn('crane'))+' #'+esc(x.no)+'</span><div class="tr"><div class="fl" style="width:'+w.toFixed(1)+'%"></div></div><span class="v">'+cN(x.box)+(x.long?' · '+esc(nn('lg')):'')+(isM?' · '+esc(nn('pen')):'')+'</span></div>'}).join('');
      var left=c.ok?(c.done>now?nn('left')(durMin((c.done-now)/60000)):nn('overdue')(durMin((now-c.done)/60000))):'';
      html+='<tr class="ex"><td colspan="11"><div class="ex-grid"><div>'+bars+'</div><div><div class="vsub">'+esc(left)+'</div><div class="vsub" style="margin-top:6px">'+esc(nn('l_src'))+': '+esc(d.src||'–')+'</div>'+(d.note?'<p class="vsub" style="margin:6px 0">'+esc(d.note)+'</p>':'')+'<button type="button" class="btn" data-open="'+esc(d.id)+'" style="margin-top:6px">'+esc(nn('dl_open'))+'</button></div></div></td></tr>';
    }
  });
  if(body)body.innerHTML=html+'</tbody></table></div>';
}

/* ----- event ----- */
document.addEventListener('click',function(e){
  var t=e.target;if(!t||!t.closest)return;var b;
  if(t.id==='ov'){closeOv();return}
  if((b=t.closest('#tabbar [data-tab]'))){showTab(b.getAttribute('data-tab'));return}
  if(t.closest('#tabbar [data-bell]')){openDelayPop(true);return}
  if(t.closest('[data-ack]')){ackDelays();return}
  if(t.closest('[data-goalert]')){POP.dismissed=true;closeOv();showTab('alert');window.scrollTo(0,0);return}
  if((b=t.closest('[data-globe]'))){var gid=b.getAttribute('data-globe');POP.dismissed=true;closeOv();showTab('globe');setTimeout(function(){glFocus(gid)},60);return}
  if(t.closest('[data-close]')){POP.dismissed=true;closeOv();return}
  if((b=t.closest('[data-bal]'))){var bid=b.getAttribute('data-bal');BOPEN=BOPEN===bid?null:bid;renderBalance(Date.now());return}
  if((b=t.closest('[data-open]'))){openVessel(b.getAttribute('data-open'));return}
  if((b=t.closest('#af [data-af]'))){ALERT_F=b.getAttribute('data-af');renderAll();return}
  if((b=t.closest('#bchs [data-bch]'))){BCHM=b.getAttribute('data-bch');renderBalance(Date.now());return}
  if((b=t.closest('#cg-sub [data-sub-btn]'))){CSUB=b.getAttribute('data-sub-btn');cgSub();return}
  if(t.closest('#late-only')){ONLY_LATE=!ONLY_LATE;renderAll();return}
});
document.addEventListener('keydown',function(e){
  var o=document.getElementById('ov');
  if(e.key==='Escape'&&o&&!o.hidden){POP.dismissed=true;closeOv();return}
  if(e.key==='Tab'&&o&&!o.hidden){
    var f=[].slice.call(o.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')).filter(function(x){return !x.disabled});
    if(!f.length)return;var i=f.indexOf(document.activeElement);
    if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}
    return;
  }
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.tagName!=='BUTTON'){
    var oid=e.target.getAttribute('data-open'),bal=e.target.getAttribute('data-bal');
    if(oid){e.preventDefault();openVessel(oid)}else if(bal){e.preventDefault();BOPEN=BOPEN===bal?null:bal;renderBalance(Date.now())}
  }
});
